# rsconstruct build configuration for this repository.

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). dep_auto entries are
# silently skipped where absent. Repos still on config/*.py keep a
# dep_inputs override in their local overlay until converted.
[processor.tera]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
	"config/github.lua",
	"config/python.lua",
	"config/shared.lua",
]
src_dirs = ["tera.templates"]

[processor.ruff]
src_dirs = ["src", "scripts", "config"]

[processor.pylint]
src_dirs = ["src", "scripts", "config"]

[processor.mypy]
src_dirs = ["src", "scripts", "config"]

[processor.luacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

# The Makefile compiled each src/**/*.kt into a runnable jar with
# `kotlinc x.kt -include-runtime -d x.jar`. The generator drives
# scripts/kotlinc_build.py, which runs the same compile.
[processor.generator.kotlin]
command = "scripts/kotlinc_build.py"
src_dirs = ["src"]
src_extensions = [".kt"]
output_dir = "out"
output_extension = "jar"
batch = false

# kotlinc (the Kotlin compiler) builds the demos.
[dependencies]
system = [
    "kotlin",
]

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]
